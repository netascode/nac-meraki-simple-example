---
# Two branch networks built from the shared "branch_baseline" template.
# Each network references the template and supplies only its site-specific
# values. Subnets and gateways (data_/voice_*) come from NetBox - see netbox.tf.
# Add a new site by copying a block and changing the variables -
# no need to repeat the full wireless/appliance configuration.
meraki:
  domains:
    - name: "cisco.com"  # same domain/org as networks.nac.yaml (merged)
      organizations:
        - name: "Demo Organization"
          networks:
            - name: "Rome-Branch-01"
              templates:
                - branch_baseline
              variables:
                corporate_ssid: "Rome-Corp"
                corporate_psk: "RomePassword123"
            - name: "Lisbon-Branch-01"
              templates:
                - branch_baseline
              variables:
                corporate_ssid: "Lisbon-Corp"
                corporate_psk: "LisbonPassword123"
